<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - DIF Tecámac</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        select, input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; border: none; color: white; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: red; font-size: 13px; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>DIF Tecámac</h2>
    
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label for="departamento">Selecciona el Departamento:</label>
            <select name="departamento" id="departamento" required>
                <option value="" disabled selected>-- Elige una opción --</option>
                {% for depto in departamentos %}
                    <option value="{{ depto }}">{{ depto }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" name="password" id="password" required placeholder="Introduce tu contraseña">
        </div>

        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
